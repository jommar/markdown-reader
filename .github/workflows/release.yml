name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump (for manual dispatch — normally use the release skill: npm version + tag push)"
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm ci
      - name: Guard version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(jq -r .version package.json)"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::package.json version $PKG != tag $TAG — run 'npm version <bump> -m \"chore: bump to %s\"' before pushing tag"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:component
      - run: npm run build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: latest=auto
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish to npm (provenance, OIDC)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --provenance --access public
        # Trusted Publishing (OIDC) preferred — no NPM_TOKEN needed once
        # https://www.npmjs.com/package/@jommar/markdown-reader → Settings → Trusted Publishers
        # is linked to jommar/markdown-reader. Fallfalls back to NPM_TOKEN if still present
        # (setup-node writes .npmrc from NODE_AUTH_TOKEN when set).
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Pack dist archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: tar czf "markdown-reader-dist-${GITHUB_REF_NAME}.tar.gz" -C dist .
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            markdown-reader-dist-${{ github.ref_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
